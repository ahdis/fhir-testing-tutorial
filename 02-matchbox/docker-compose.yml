name: fhir-testing-tutorial
services:
  matchbox:
    image: ${MATCHBOX_IMAGE:-europe-west6-docker.pkg.dev/ahdis-ch/ahdis/matchbox:v5.0.0-rc5}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./application.yaml:/config/application.yaml:ro
    environment:
      JAVA_TOOL_OPTIONS: -Xmx3g
